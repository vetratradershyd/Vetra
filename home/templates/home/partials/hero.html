{% load static %}

<section class="hero" id="hero">

    <!-- Hero Image -->
    <div class="hero-image">
        <img src="{% static 'images/vetra_hero.jpg' %}" alt="Smart Home">
    </div>

    <!-- Dark blend over image -->
    <div class="hero-fade"></div>

    <!-- Content -->
    <div class="container hero-container">

        <div class="hero-content">

            <span class="hero-subtitle">
                SMART HOME AUTOMATION
            </span>

            <h1>
                Smart Living
                <span>Starts Here</span>
            </h1>

            <p>
                Transform your home with intelligent automation,
                premium security, smart lighting, surveillance,
                and energy-efficient solutions.
            </p>

            <div class="hero-buttons">

                <a href="#products" class="btn btn-gold">
                    Explore Products
                </a>

                <a href="#contact" class="btn btn-outline">
                    Contact Us
                </a>

            </div>

        </div>

    </div>

</section>
